[project]
name = "xochi-signer"
version = "0.1.0"
description = "Python conformance signer for the Riddler protocol (@xochi/spec vectors)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "eth-account>=0.11.0",
    "eth-abi>=5.0.0",
    "eth-utils>=4.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xochi_signer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
