# Does the running solver still serve what this repo vendored and verifies?
#
# Probe rules (why scheduled, why "could not check" fails) and exit codes:
# scripts/probe-lib.mjs. Each probe's own logic: its header under scripts/.
# The openapi probe's compared axes: packages/spec/wire/README.md.
#
# SETUP: both jobs need the repository variable `RIDDLER_URL_PROD` (a variable,
# not a secret: it is a base URL, and this repo bakes in no host). Unset, every
# run exits MISCONFIGURED.
#
# Not covered: /solver/*. Prod does not serve the solver surface, so bid-sealing
# parity rests on lockstep review of `npm run generate:solver-bid-v2`.
name: producer-drift

# Read-only: the jobs check out the repo and write nothing back.
permissions:
  contents: read

on:
  schedule:
    # 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Which probe to run. The schedule always runs all of them."
        type: choice
        default: all
        options:
          - all
          - deposit-attestation-version
          - deposit-attestation-vectors
          - spec-version
          - openapi

# A job with SOME steps deselected would report green, so each two-probe job
# ends with a step that fails a partial dispatch. The scheduled run is always
# `all` and is the status that means anything.

jobs:
  deposit-attestation-drift:
    # `inputs.probe` is null on the schedule, so the fallback is what runs daily.
    if: ${{ (inputs.probe || 'all') == 'all' || startsWith(inputs.probe, 'deposit-attestation-') }}
    runs-on: ubuntu-latest
    env:
      PROBE: ${{ inputs.probe || 'all' }}
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No `npm ci`, no build: the probes use only Node builtins and read pinned
      # values from source, never from `dist/`.

      # Gated on the checkout rather than `success() || failure()`: without a
      # working tree Node exits 1, the code reserved for DRIFT. `!cancelled()`
      # keeps the probes independent of each other's verdict.
      - name: Version the solver signs vs the version @xochi/signer verifies
        if: >-
          ${{ !cancelled()
          && steps.checkout.outcome == 'success'
          && (env.PROBE == 'all' || env.PROBE == 'deposit-attestation-version') }}
        env:
          RIDDLER_SERVER: prod
          RIDDLER_URL_PROD: ${{ vars.RIDDLER_URL_PROD }}
        run: node scripts/verify-deposit-attestation-version.mjs

      - name: Vendored vectors vs the published artifact
        if: >-
          ${{ !cancelled()
          && steps.checkout.outcome == 'success'
          && (env.PROBE == 'all' || env.PROBE == 'deposit-attestation-vectors') }}
        env:
          RIDDLER_SERVER: prod
          RIDDLER_URL_PROD: ${{ vars.RIDDLER_URL_PROD }}
        run: node scripts/verify-deposit-attestation-vectors.mjs

      # `success()`, so a real DRIFT above stays the only failure in the log.
      - name: A partial sweep is not a clean one
        if: ${{ success() && env.PROBE != 'all' }}
        run: |
          echo "PARTIAL: only probe=${PROBE} ran (it agreed); this job covers both attestation probes."
          echo "Re-dispatch with probe=all for a sweep."
          exit 1

  # Its own job: the attestation and contract probes answer different questions
  # on different release cadences, so each gets its own status.
  # key must stay spec-version-drift (branch protection)
  spec-version-drift:
    name: "contract drift (spec_version + served openapi)"
    if: >-
      ${{ (inputs.probe || 'all') == 'all'
      || inputs.probe == 'spec-version'
      || inputs.probe == 'openapi' }}
    runs-on: ubuntu-latest
    env:
      PROBE: ${{ inputs.probe || 'all' }}
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Idles ~5m30s between its two samples (scripts/verify-spec-version.mjs).
      - name: Advertised spec_version vs packages/spec
        if: >-
          ${{ !cancelled()
          && steps.checkout.outcome == 'success'
          && (env.PROBE == 'all' || env.PROBE == 'spec-version') }}
        env:
          RIDDLER_SERVER: prod
          RIDDLER_URL_PROD: ${{ vars.RIDDLER_URL_PROD }}
        run: node scripts/verify-spec-version.mjs

      - name: Served /xochi/openapi.json vs the vendored wire contract
        if: >-
          ${{ !cancelled()
          && steps.checkout.outcome == 'success'
          && (env.PROBE == 'all' || env.PROBE == 'openapi') }}
        env:
          RIDDLER_SERVER: prod
          RIDDLER_URL_PROD: ${{ vars.RIDDLER_URL_PROD }}
        run: node scripts/verify-openapi.mjs

      - name: A partial sweep is not a clean one
        if: ${{ success() && env.PROBE != 'all' }}
        run: |
          echo "PARTIAL: only probe=${PROBE} ran (it agreed); this job covers spec_version and openapi."
          echo "Re-dispatch with probe=all for a sweep."
          exit 1
