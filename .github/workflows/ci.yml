name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # @xochi/sdk (packages/sdk). The job key stays `check`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/erc8262

      # Same gates as prepublishOnly, so a green CI means `npm publish` passes.
      # Drift tests run against the pinned ERC-8262 and fail (not skip) when it is missing.
      - name: Format
        run: npm run format:check -w @xochi/sdk

      - name: Format (repo root json/md)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck -w @xochi/sdk

      - name: Unit tests
        run: npm test -w @xochi/sdk

      - name: Build
        run: npm run build -w @xochi/sdk

      - name: Verify package contents
        run: npm pack --dry-run -w @xochi/sdk

  # @xochi/client, @xochi/widget-lib and @xochi/provider: the prepublishOnly
  # gates, one check per package (named after it). No foundry: provider's parity
  # vectors are pinned in its tests and its daemon -> proof -> on-chain path runs
  # in `integration`; its typecheck covers the daemon, which is not in the tarball.
  package:
    name: ${{ matrix.ws }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ws: [client, widget-lib, provider]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Build @xochi/signer (the client reads its .d.ts)
        if: matrix.ws == 'client'
        run: npm run build -w @xochi/signer

      - name: Format
        run: npm run format:check -w @xochi/${{ matrix.ws }}

      - name: Typecheck
        run: npm run typecheck -w @xochi/${{ matrix.ws }}

      - name: Unit tests
        run: npm test -w @xochi/${{ matrix.ws }}

      - name: Build
        run: npm run build -w @xochi/${{ matrix.ws }}

      - name: Verify package contents
        run: npm pack --dry-run -w @xochi/${{ matrix.ws }}

  # The protocol packages (packages/{signer,spec,solver-sdk,reference}).
  # @xochi/signer builds first: every other workspace consumes its .d.ts. The
  # vector check is the gate that matters; a regenerated vector is a wire change
  # (packages/spec/README.md "Who is authoritative").
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Format (sources and tests; generated vectors, openapi.json and Markdown excluded)
        run: |
          npm run format:check -w @xochi/signer
          npm run format:check -w @xochi/solver-sdk
          npm run format:check -w @xochi/reference
          npm run format:check -w @xochi/spec

      - name: Build @xochi/signer, @xochi/solver-sdk and @xochi/client (the generators import them)
        run: |
          npm run build -w @xochi/signer
          npm run build -w @xochi/solver-sdk
          npm run build -w @xochi/client

      - name: Typecheck
        run: |
          npm run typecheck -w @xochi/signer
          npm run typecheck -w @xochi/solver-sdk
          npm run typecheck -w @xochi/reference
          npm run typecheck -w @xochi/spec

      - name: Tests (signer vectors + reference conformance/fee + solver + wire differ + erc8262)
        run: |
          npm test -w @xochi/signer
          npm test -w @xochi/reference
          npm test -w @xochi/solver-sdk
          npm test -w @xochi/spec

      # Regenerates every vector set and diffs it against the committed bytes, then
      # checks openapi.json against openapi.sha256. The served wire contract is not
      # refetched here: the producer owns those bytes, and drift from it is the
      # nightly probe's finding (producer-drift.yml).
      - name: Vector staleness and wire digest check
        run: npm run check:vectors -w @xochi/spec

      - name: Verify package contents
        run: |
          npm pack --dry-run -w @xochi/spec
          npm pack --dry-run -w @xochi/signer

  # conformance/shielded-recipient.json held to the real Aztec SDKs: exact-pinned
  # `@aztec/*` 5.2.0 and `@aztec-labs/*` 6.0.0 (class ids, constructor selector,
  # separators, key derivation, every descriptor address and intermediate, the wide
  # reduction, and every Schnorr verdict through bb.js). Its own package and lockfile,
  # not a workspace, so the ~850 MB of SDK never reaches the other jobs.
  aztec-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/spec/aztec-crosscheck/package-lock.json

      - name: Shielded recipient vectors vs Aztec SDK 5.2.0 and 6.0.0
        working-directory: packages/spec/aztec-crosscheck
        run: |
          npm ci
          npm run crosscheck

  recipient-tool:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: tools/recipient/package-lock.json

      - name: Pin recipient npm
        run: npm install --global npm@10.9.9


      - name: OXDAI recipient tool and installable test artifact
        working-directory: tools/recipient
        run: |
          npm ci
          npm run typecheck
          npm run format:check
          npm test
          npm run build
          node dist/cli.js plan
          node --check qualify/sandbox.mjs
          node --check scripts/smoke-no-plaintext-keys.mjs
          node --check scripts/build-release.mjs
          node --check scripts/seed-locked-cache.mjs
          node --check scripts/verify-installed-closure.mjs
          node --check scripts/qualify-extracted-root.mjs
          node --check scripts/record-release-qualification.mjs
          node --check scripts/verify-release-immutability.mjs
          bash -n scripts/build-broadcaster.sh
          bash -n qualify/freeze-fork.sh
          bash -n qualify/independent-restore.sh

          node scripts/build-release.mjs --out release-a
          node scripts/build-release.mjs --out release-b
          cmp release-a/*.tgz release-b/*.tgz
          cmp release-a/*.cdx.json release-b/*.cdx.json
          cmp release-a/*.release.json release-b/*.release.json
          cmp release-a/SHA256SUMS release-b/SHA256SUMS

          stage="$(mktemp -d)"
          locked_cache="$(mktemp -d)"
          receipt="$(mktemp)"
          tar -xzf release-a/*.tgz -C "$stage"
          test -f "$stage/package/package.json"
          test -f "$stage/package/npm-shrinkwrap.json"
          node "$stage/package/scripts/qualify-extracted-root.mjs" \
            --package-root "$stage/package" \
            --release-dir "$PWD/release-a" \
            --cache "$locked_cache" \
            --receipt "$receipt"
          node scripts/record-release-qualification.mjs \
            --receipt "$receipt" \
            --release-dir release-a \
            --release-dir release-b

          cmp release-a/*.tgz release-b/*.tgz
          cmp release-a/*.cdx.json release-b/*.cdx.json
          cmp release-a/*.release.json release-b/*.release.json
          cmp release-a/SHA256SUMS release-b/SHA256SUMS
          version="$(node -p "require('./package.json').version")"
          [[ "$(node "$stage/package/dist/cli.js" --version)" == "$version" ]]
          diagnostics="$(node "$stage/package/dist/cli.js" diagnostics)"
          [[ "$diagnostics" == *'"corridorRevision":"2"'* ]]

      - uses: actions/upload-artifact@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          name: xochi-recipient-test-artifact
          path: tools/recipient/release-a/*
          if-no-files-found: error
          retention-days: 7

  # packages/recipient-core: the platform-neutral recipient core and its browser adapters. Its
  # own package and lockfile, not a workspace, so the Aztec SDK never reaches the other jobs. The
  # CLI compiles the same sources through tools/recipient/src/core (recipient-tool job above).
  recipient-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: packages/recipient-core/package-lock.json

      - name: Recipient core, browser adapters (headless Chromium) and attestation verifier
        working-directory: packages/recipient-core
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck
          npm run format:check
          npm test
          npm run build

  python-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv==0.11.6

      - name: Python conformance runner (byte-equality over the shared fixture)
        working-directory: runners/python
        run: |
          uv sync --locked
          uv run pytest -q

  go-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: runners/go/go.mod

      - name: Go conformance runner (byte-equality over the shared fixture)
        working-directory: runners/go
        run: go test ./...

  rust-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain (runners/rust/rust-toolchain.toml)
        working-directory: runners/rust
        run: rustup toolchain install

      - name: Rust conformance runner (byte-equality over the shared fixture)
        working-directory: runners/rust
        run: cargo test --locked

  integration:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/erc8262

      - name: Integration tests
        run: npm run test:integration -w @xochi/sdk
