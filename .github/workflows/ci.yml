name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # ERC-8262 commit the bundled circuits and ABIs are synced to. Bump together
  # with packages/sdk/scripts/sync-circuits.sh output.
  ERC_8262_REF: 0147684f9bee9b7b0f2f3aa5ca04f2a4c3b530e0
  FOUNDRY_VERSION: v1.5.1

jobs:
  # @xochi/sdk (packages/sdk). The job key stays `check`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Checkout ERC-8262 at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/xochi-fi/ERC-8262.git ../ERC-8262
          git -C ../ERC-8262 checkout --quiet "$ERC_8262_REF"
          git -C ../ERC-8262 submodule update --init --recursive --depth=1

      - name: Build contracts
        working-directory: ../ERC-8262
        run: forge build

      # Same gates as prepublishOnly, so a green CI means `npm publish` passes.
      # Drift tests run against the pinned ERC-8262 and fail (not skip) when it is missing.
      - name: Format
        run: npm run format:check -w @xochi/sdk

      - name: Format (repo root json/md)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck -w @xochi/sdk

      - name: Unit tests
        run: npm test -w @xochi/sdk

      - name: Build
        run: npm run build -w @xochi/sdk

      - name: Verify package contents
        run: npm pack --dry-run -w @xochi/sdk

  # @xochi/client (packages/client): the same prepublishOnly gates, run from the
  # workspace root so the root lockfile resolves it. Needs no foundry.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build @xochi/signer (the client reads its .d.ts)
        run: npm run build -w @xochi/signer

      - name: Format
        run: npm run format:check -w @xochi/client

      - name: Typecheck
        run: npm run typecheck -w @xochi/client

      - name: Unit tests
        run: npm test -w @xochi/client

      - name: Build
        run: npm run build -w @xochi/client

      - name: Verify package contents
        run: npm pack --dry-run -w @xochi/client

  # @xochi/widget-lib (packages/widget-lib): the same prepublishOnly gates. Its
  # own job, so a red client job does not hide the embed library's status.
  widget-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check -w @xochi/widget-lib

      - name: Typecheck
        run: npm run typecheck -w @xochi/widget-lib

      - name: Unit tests
        run: npm test -w @xochi/widget-lib

      - name: Build
        run: npm run build -w @xochi/widget-lib

      - name: Verify package contents
        run: npm pack --dry-run -w @xochi/widget-lib

  # The protocol packages (packages/{signer,spec,solver-sdk,reference}). The
  # build order is not optional: @xochi/signer first, since every other
  # workspace consumes its .d.ts. The generate steps are the gate that matters:
  # those bytes are a contract Riddler and raxol_payments are held to, so a
  # regeneration is a wire change landing with the server, never a refresh to
  # make CI pass.
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format (sources and tests; generated vectors, openapi.json and Markdown excluded)
        run: |
          npm run format:check -w @xochi/signer
          npm run format:check -w @xochi/solver-sdk
          npm run format:check -w @xochi/reference
          npm run format:check -w @xochi/spec

      - name: Build @xochi/signer first (dependents need its .d.ts)
        run: npm run build -w @xochi/signer

      - name: Build @xochi/solver-sdk (the bid-vector generator imports it)
        run: npm run build -w @xochi/solver-sdk

      - name: Build @xochi/client (the fee generator and fee vector suite import it)
        run: npm run build -w @xochi/client

      - name: Typecheck
        run: |
          npm run typecheck -w @xochi/signer
          npm run typecheck -w @xochi/solver-sdk
          npm run typecheck -w @xochi/reference
          npm run typecheck -w @xochi/spec

      - name: Tests (signer vectors + reference conformance/fee + solver + wire differ)
        run: |
          npm test -w @xochi/signer
          npm test -w @xochi/reference
          npm test -w @xochi/solver-sdk
          npm test -w @xochi/spec

      - name: Fixture staleness check (conformance + fee)
        run: |
          npm run generate:conformance
          npm run generate:fee
          git diff --exit-code packages/spec/conformance/conformance.json packages/spec/fee/

      - name: Solver vector staleness check (bid v2 + escrow)
        run: |
          npm run generate:solver-bid-v2
          npm run generate:escrow
          git diff --exit-code packages/spec/conformance/

      # The wire artifact's gate is NOT `generate:wire` + `git diff --exit-code`
      # like the two above: the producer owns those bytes, so a refetch reddens
      # any PR that runs while the server is ahead, and that is the nightly
      # probe's finding (`verify:openapi`, producer-drift.yml), not this PR's.
      # What is checkable per-PR is that the pair is internally consistent -- a
      # hand-edit or an interrupted refresh leaves a document whose digest is
      # somebody's assertion rather than its content.
      - name: Wire contract digest check
        run: |
          cd packages/spec/wire
          printf '%s  openapi.json\n' "$(cat openapi.sha256)" | shasum -a 256 -c -

      - name: Verify package contents
        run: |
          npm pack --dry-run -w @xochi/spec
          npm pack --dry-run -w @xochi/signer

  python-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv==0.11.6

      - name: Python conformance runner (byte-equality over the shared fixture)
        working-directory: sdks/python
        run: |
          uv sync --locked
          uv run pytest -q

  go-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: sdks/go/go.mod

      - name: Go conformance runner (byte-equality over the shared fixture)
        working-directory: sdks/go
        run: go test ./...

  rust-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rust conformance runner (byte-equality over the shared fixture)
        working-directory: sdks/rust
        run: cargo test --locked

  integration:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Checkout ERC-8262 at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/xochi-fi/ERC-8262.git ../ERC-8262
          git -C ../ERC-8262 checkout --quiet "$ERC_8262_REF"
          git -C ../ERC-8262 submodule update --init --recursive --depth=1

      - name: Build contracts
        working-directory: ../ERC-8262
        run: forge build

      - name: Integration tests
        run: npm run test:integration -w @xochi/sdk
