# Publish one package to npm from a tag.
#
#   sdk-v<version>         -> npm publish -w @xochi/sdk
#   spec-v<version>        -> npm publish -w @xochi/spec
#   signer-v<version>      -> npm publish -w @xochi/signer
#   client-v<version>      -> npm publish -w @xochi/client
#   widget-lib-v<version>  -> npm publish -w @xochi/widget-lib
#   provider-v<version>    -> npm publish -w @xochi/provider
#
# Not published from here: @xochi/reference (private) and @xochi/solver-sdk,
# which ships once the solver panel opens. Its mapping is deliberately absent
# rather than commented out: adding `solver-sdk-v*` to `on.push.tags` and a case
# arm below is the whole change, made when that decision is.
#
# npm trusted publishing (OIDC), so there is no NPM_TOKEN anywhere: npm
# exchanges this job's id-token for a short-lived publish credential, and only
# for the package/repo/workflow/environment configured on npmjs.com
# (https://docs.npmjs.com/trusted-publishers). SETUP, once per package on
# npmjs.com: Settings -> Trusted publisher -> GitHub Actions, with
#   - repository xochi-fi/xochi-sdk, workflow `release.yml`;
#   - environment `npm-publish`. REQUIRED although npm calls it optional: it is
#     the ONLY thing stopping a tag on an older commit, whose own release.yml
#     lacks the environment, from publishing (see "Why the environment"
#     below);
#   - Allowed actions: `npm publish`. A config created after 2026-09-03 allows
#     only `npm stage publish` by default, and this job runs `npm publish`.
# A new config expires unless its first publish succeeds within 2 days, so
# create it only when the tag is ready to push. `--provenance` needs the
# repository to be public.
#
# First publish. A trusted publisher can only be attached to a package that
# already exists, so @xochi/spec, @xochi/signer, @xochi/client,
# @xochi/widget-lib and @xochi/provider cannot make their first publish here.
# The conservative procedure, once per package: an npm owner with 2FA checks
# out the reviewed release tag's commit (on main), runs the same gates this job
# runs for that package, and runs `npm publish -w <name>` by hand (the real
# reviewed version, never a placeholder; provenance comes only from this job's
# `--provenance` flag, never `publishConfig`). @xochi/signer
# goes before @xochi/client, which depends on it. Then attach the config above
# (`npm trust github <name> --file release.yml --repo xochi-fi/xochi-sdk
# --env npm-publish --allow-publish`) and set Settings -> Publishing access ->
# "Require two-factor authentication and disallow tokens", so every later
# version publishes only from this workflow.
#
# Why the environment. A tag push runs the release.yml of the TAGGED commit,
# not main's, so no step in this file can guard a tag on a commit that does not
# carry this file: every older main commit runs its own older workflow, and a
# commit on any branch can carry a release.yml with the checks deleted. What
# such a workflow cannot change is the OIDC token's `environment` claim, which
# GitHub sets only for a job that enters the environment and passes its
# protection rules. So the gate is three settings outside this file, and the
# steps below are defence in depth on top of them:
#   - npmjs.com trusted publisher requires environment `npm-publish`, so a
#     workflow without it gets no credential;
#   - GitHub environment `npm-publish` accepts deployments only from tags
#     matching the six patterns below;
#   - GitHub tag ruleset "release tags" lets only repository admins create,
#     move or delete those tags.
#
# `npm publish -w @xochi/sdk` by hand still works and runs the same gates
# (prepublishOnly); this workflow runs them too, in CI, with provenance.
#
# The publish runs only after the gates ci.yml runs for that package, and only
# when the tag's version is the version in that package's package.json: a tag
# that disagrees would publish bytes under a name nobody reviewed. Every
# package's prepublishOnly (format:check, typecheck, test and, where it has a
# build, build) runs again inside `npm publish`.
name: release

on:
  push:
    tags:
      - "sdk-v*"
      - "spec-v*"
      - "signer-v*"
      - "client-v*"
      - "widget-lib-v*"
      - "provider-v*"

permissions:
  contents: read

# One publish per tag at a time; a re-pushed tag must not race itself.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Same pins as ci.yml; the @xochi/sdk gate needs the ERC-8262 artifacts.
  ERC_8262_REF: 02b104cceb5fba49939d3afe843ccb61f73e7e6c
  FOUNDRY_VERSION: v1.5.1

jobs:
  publish:
    runs-on: ubuntu-latest
    # The gate this file cannot enforce on itself (header, "Why the
    # environment"): npm issues a credential only to a job in this environment,
    # and the environment admits only release tags.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # Actions are pinned to full commit SHAs: this job holds id-token: write,
      # so a moved tag would run someone else's code with publish rights.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0

      # Publish only what main has reviewed: a tag pushed on an unmerged branch
      # would otherwise publish bytes no one approved.
      - name: Tagged commit is on main
        run: |
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tagged commit $GITHUB_SHA is not on main; refusing to publish" >&2
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # No dependency cache: this job holds id-token: write, and a cache
          # entry written by another workflow run would be installed here
          # (npm's trusted-publishing guide: never cache in release builds).
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; refuse rather than fall back to
      # a token-less publish that fails late with an opaque 404. Pinned exactly,
      # so the tool that publishes is the one reviewed here.
      - name: npm >= 11.5.1 (trusted publishing)
        run: |
          npm install -g npm@11.21.0
          v="$(npm --version)"
          # shellcheck disable=SC2016 # a single-quoted node program; ${} is a JS template literal
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} is older than 11.5.1`);
              process.exit(1);
            }' "$v"
          echo "npm $v"

      - name: Resolve package from tag and check its version
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            sdk-v*)        name='@xochi/sdk';        dir='packages/sdk';        version="${TAG#sdk-v}" ;;
            spec-v*)       name='@xochi/spec';       dir='packages/spec';       version="${TAG#spec-v}" ;;
            signer-v*)     name='@xochi/signer';     dir='packages/signer';     version="${TAG#signer-v}" ;;
            client-v*)     name='@xochi/client';     dir='packages/client';     version="${TAG#client-v}" ;;
            widget-lib-v*) name='@xochi/widget-lib'; dir='packages/widget-lib'; version="${TAG#widget-lib-v}" ;;
            provider-v*)   name='@xochi/provider';   dir='packages/provider';   version="${TAG#provider-v}" ;;
            *) echo "tag $TAG names no publishable package" >&2; exit 1 ;;
          esac
          manifest_name="$(node -p "require('./$dir/package.json').name")"
          manifest="$(node -p "require('./$dir/package.json').version")"
          if [ "$manifest_name" != "$name" ]; then
            echo "$dir/package.json is $manifest_name, not $name; refusing to publish" >&2
            exit 1
          fi
          if [ "$manifest" != "$version" ]; then
            echo "tag $TAG says $version but $dir/package.json is $manifest; refusing to publish" >&2
            exit 1
          fi
          # A prerelease goes to `next`. A stable version passes no --tag at all
          # (an explicit `--tag latest` would let a backport roll `latest`
          # back), and is refused below unless it sorts above the current
          # `latest`. npm's own refusal is not relied on: it reads registry
          # versions through a path that swallows errors and then sees none.
          # Publish a backport by hand under a maintenance tag.
          case "$version" in
            *-*) dist_tag='next' ;;
            *)   dist_tag='' ;;
          esac
          if [ -z "$dist_tag" ]; then
            if latest="$(npm view "$name" dist-tags.latest 2>"$RUNNER_TEMP/npm-view.err")"; then
              :
            elif grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
              latest=''
            else
              cat "$RUNNER_TEMP/npm-view.err" >&2
              echo "cannot read $name's latest dist-tag; refusing to publish" >&2
              exit 1
            fi
            if [ -n "$latest" ]; then
              # Exit 0 only when $1 > $2 (semver precedence, prerelease below
              # its release; build metadata ignored).
              # shellcheck disable=SC2016 # a single-quoted node program; ${} is a JS template literal
              node -e '
                const parse = (v) => {
                  const m = /^(\d+)\.(\d+)\.(\d+)(?:-([^+]+))?(?:\+.*)?$/.exec(v);
                  if (!m) { console.error(`not a semver version: ${v}`); process.exit(2); }
                  return { core: m.slice(1, 4).map(BigInt), pre: m[4] ? m[4].split(".") : [] };
                };
                const cmpId = (x, y) => {
                  const nx = /^\d+$/.test(x), ny = /^\d+$/.test(y);
                  if (nx && ny) return BigInt(x) < BigInt(y) ? -1 : BigInt(x) > BigInt(y) ? 1 : 0;
                  if (nx !== ny) return nx ? -1 : 1;
                  return x < y ? -1 : x > y ? 1 : 0;
                };
                const cmp = (a, b) => {
                  for (let i = 0; i < 3; i++) if (a.core[i] !== b.core[i]) return a.core[i] < b.core[i] ? -1 : 1;
                  if (!a.pre.length || !b.pre.length) return b.pre.length - a.pre.length;
                  for (let i = 0; i < Math.min(a.pre.length, b.pre.length); i++) {
                    const c = cmpId(a.pre[i], b.pre[i]);
                    if (c) return c;
                  }
                  return a.pre.length - b.pre.length;
                };
                process.exit(cmp(parse(process.argv[1]), parse(process.argv[2])) > 0 ? 0 : 1);
              ' "$version" "$latest" || {
                echo "$name@$version does not sort above latest $latest; refusing to publish" >&2
                exit 1
              }
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "publishing $name@$version (dist-tag ${dist_tag:-latest, if highest})"

      - run: npm ci

      # @xochi/client's typecheck reads @xochi/signer's built .d.ts; the protocol
      # gate (spec, signer) also needs the built @xochi/solver-sdk (the bid-vector
      # generator imports it) and @xochi/client (the fee generator and fee vector
      # suite import it). @xochi/sdk, @xochi/provider and @xochi/widget-lib
      # depend on none of them.
      - name: Build @xochi/signer, @xochi/solver-sdk and @xochi/client
        if: steps.pkg.outputs.name == '@xochi/spec' || steps.pkg.outputs.name == '@xochi/signer' || steps.pkg.outputs.name == '@xochi/client'
        run: |
          npm run build -w @xochi/signer
          npm run build -w @xochi/solver-sdk
          npm run build -w @xochi/client

      # --- @xochi/sdk: the ci.yml `check` gate (drift tests need ERC-8262) ----

      - name: Install foundry
        if: steps.pkg.outputs.name == '@xochi/sdk'
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Checkout and build ERC-8262 at the pinned commit
        if: steps.pkg.outputs.name == '@xochi/sdk'
        run: |
          git clone --filter=blob:none https://github.com/xochi-fi/ERC-8262.git ../ERC-8262
          git -C ../ERC-8262 checkout --quiet "$ERC_8262_REF"
          git -C ../ERC-8262 submodule update --init --recursive --depth=1
          (cd ../ERC-8262 && forge build)

      # --- @xochi/spec / @xochi/signer: the ci.yml `protocol` gate -----------

      - name: Protocol gate
        if: steps.pkg.outputs.name == '@xochi/spec' || steps.pkg.outputs.name == '@xochi/signer'
        run: |
          for w in @xochi/signer @xochi/solver-sdk @xochi/reference @xochi/spec; do
            npm run format:check -w "$w"
            npm run typecheck -w "$w"
            npm test -w "$w"
          done
          npm run generate:conformance
          npm run generate:fee
          npm run generate:erc8262
          npm run generate:solver-bid-v2
          npm run generate:escrow
          npm run generate:shielded -w @xochi/spec
          git diff --exit-code packages/spec/
          cd packages/spec/wire
          printf '%s  openapi.json\n' "$(cat openapi.sha256)" | shasum -a 256 -c -

      # Every package's prepublishOnly runs its full gate again inside npm
      # publish: format:check, typecheck, test and build (@xochi/spec has no
      # build; @xochi/provider's typecheck covers its daemon).
      - name: Publish
        run: npm publish -w ${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.dist_tag && format('--tag {0}', steps.pkg.outputs.dist_tag) || '' }} --provenance --access public
